<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title description">
  <title id="title">my e-Wish homepage visual preview</title>
  <desc id="description">An illustration of the my e-Wish homepage with warm editorial text, mood cards, and a greeting card preview.</desc>
  <defs>
    <linearGradient id="paper" x2="0" y2="1"><stop stop-color="#fbf8f2"/><stop offset="1" stop-color="#f4eee5"/></linearGradient>
    <linearGradient id="sunset" x2="0" y2="1"><stop stop-color="#edcba4"/><stop offset=".58" stop-color="#e4a998"/><stop offset=".59" stop-color="#9ba587"/><stop offset="1" stop-color="#687a64"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="15" stdDeviation="17" flood-color="#3b3428" flood-opacity=".14"/></filter>
  </defs>
  <rect width="1280" height="760" rx="26" fill="url(#paper)"/>
  <rect x="1" y="1" width="1278" height="758" rx="25" fill="none" stroke="#e5ded2"/>
  <rect x="1" y="1" width="1278" height="66" rx="25" fill="#fbf8f2"/>
  <path d="M1 66h1278" stroke="#e8e1d7"/>
  <circle cx="42" cy="33" r="16" fill="#b86f69"/>
  <text x="37" y="40" fill="#fff" font-family="Georgia,serif" font-size="24" font-style="italic">e</text>
  <text x="68" y="41" fill="#31312a" font-family="Georgia,serif" font-size="24">my e-Wish</text>
  <text x="555" y="39" fill="#77766e" font-family="Arial,sans-serif" font-size="13">How it works</text>
  <text x="682" y="39" fill="#77766e" font-family="Arial,sans-serif" font-size="13">Find your mood</text>
  <text x="1065" y="39" fill="#55544c" font-family="Arial,sans-serif" font-size="13">Sign in</text>
  <rect x="1120" y="15" width="128" height="36" rx="3" fill="#30332d"/>
  <text x="1140" y="38" fill="#fffefa" font-family="Arial,sans-serif" font-size="12">Make a wish ↗</text>
  <text x="92" y="154" fill="#9c8170" font-family="Arial,sans-serif" font-size="12" letter-spacing="2">✳  A SMALL CORNER OF THE INTERNET FOR BIG FEELINGS</text>
  <text x="88" y="246" fill="#292a25" font-family="Georgia,serif" font-size="76">Some moments</text>
  <text x="88" y="324" fill="#292a25" font-family="Georgia,serif" font-size="76">deserve <tspan fill="#b86f69" font-style="italic">more</tspan></text>
  <text x="88" y="402" fill="#292a25" font-family="Georgia,serif" font-size="76">than a text.</text>
  <text x="92" y="451" fill="#73736b" font-family="Arial,sans-serif" font-size="15">Make a little page that feels like them. A birthday, a brave</text>
  <text x="92" y="476" fill="#73736b" font-family="Arial,sans-serif" font-size="15">new beginning, a simple “I’m thinking of you” — wrapped</text>
  <text x="92" y="501" fill="#73736b" font-family="Arial,sans-serif" font-size="15">up in something they can keep.</text>
  <rect x="92" y="535" width="190" height="48" rx="3" fill="#30332d"/>
  <text x="111" y="565" fill="#fffefa" font-family="Arial,sans-serif" font-size="13">Create your first wish ↗</text>
  <text x="303" y="564" fill="#6c6b63" font-family="Arial,sans-serif" font-size="12">See how it works ↓</text>
  <text x="93" y="628" fill="#8c8a80" font-family="Arial,sans-serif" font-size="12">♡  No AI-written wishes. Just your words, made lovely.</text>
  <circle cx="910" cy="366" r="222" fill="#e9e1d3" opacity=".8"/>
  <g transform="rotate(3 910 365)" filter="url(#shadow)">
    <rect x="780" y="178" width="260" height="390" rx="2" fill="#fffefa"/>
    <rect x="793" y="191" width="234" height="166" fill="url(#sunset)"/>
    <circle cx="910" cy="255" r="41" fill="#f7e1ad"/>
    <path d="M793 329q70-42 144 7t90 6v15H793z" fill="#788969"/>
    <path d="M793 344q92-30 143 5t91-2v10H793z" fill="#526650"/>
    <text x="811" y="223" fill="#6a5947" font-family="Georgia,serif" font-size="14" font-style="italic">the good days</text>
    <text x="811" y="241" fill="#6a5947" font-family="Georgia,serif" font-size="14" font-style="italic">look good on you</text>
    <text x="811" y="386" fill="#9c8170" font-family="Arial,sans-serif" font-size="9" letter-spacing="1.5">A BIRTHDAY WISH FOR YOU</text>
    <text x="811" y="423" fill="#393a33" font-family="Georgia,serif" font-size="27">For your next</text>
    <text x="811" y="452" fill="#b86f69" font-family="Georgia,serif" font-size="27" font-style="italic">beautiful chapter.</text>
    <text x="811" y="480" fill="#79786f" font-family="Arial,sans-serif" font-size="11">Here’s to all the little things</text>
    <text x="811" y="496" fill="#79786f" font-family="Arial,sans-serif" font-size="11">that make you, you.</text>
    <path d="M811 516h196" stroke="#eee9df"/>
    <text x="811" y="540" fill="#7d6e5f" font-family="Georgia,serif" font-size="11" font-style="italic">✦  there’s a little secret inside</text>
  </g>
  <text x="1062" y="240" fill="#b86f69" font-family="Georgia,serif" font-size="41">✳</text>
  <text x="748" y="499" fill="#b86f69" font-family="Georgia,serif" font-size="43">♡</text>
  <text x="73" y="724" fill="#887f70" font-family="Georgia,serif" font-size="15" font-style="italic">Illustrative product preview</text>
</svg>
