<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title description">
  <title id="title">my e-Wish recipient page visual preview</title>
  <desc id="description">An illustrative personal greeting page with a full-width photo, custom message, and revealable surprise.</desc>
  <defs>
    <linearGradient id="background" x2="0" y2="1"><stop stop-color="#efe2da"/><stop offset=".55" stop-color="#f8f6f1"/></linearGradient>
    <linearGradient id="photo" x2="0" y2="1"><stop stop-color="#f1cda8"/><stop offset=".52" stop-color="#da9c82"/><stop offset=".53" stop-color="#9da585"/><stop offset="1" stop-color="#65755f"/></linearGradient>
    <filter id="shadow" x="-30%" y="-20%" width="160%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#413727" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1280" height="760" rx="26" fill="url(#background)"/>
  <rect x="1" y="1" width="1278" height="758" rx="25" fill="none" stroke="#e5ded2"/>
  <circle cx="42" cy="38" r="16" fill="#b86f69"/>
  <text x="37" y="45" fill="#fff" font-family="Georgia,serif" font-size="24" font-style="italic">e</text>
  <text x="68" y="46" fill="#31312a" font-family="Georgia,serif" font-size="24">my e-Wish</text>
  <text x="927" y="43" fill="#8c887f" font-family="Georgia,serif" font-size="14" font-style="italic">A little something, made with love</text>
  <path d="M40 77h1200" stroke="#ded9ce"/>
  <g filter="url(#shadow)">
    <rect x="315" y="115" width="650" height="598" fill="#fffefa" stroke="#e6e0d6"/>
    <text x="640" y="151" fill="#8c796b" font-family="Arial,sans-serif" font-size="10" font-weight="bold" letter-spacing="2" text-anchor="middle">BIRTHDAY · HEARTFELT</text>
    <rect x="346" y="171" width="588" height="274" fill="url(#photo)"/>
    <circle cx="755" cy="253" r="54" fill="#f7e1ad" opacity=".94"/>
    <path d="M346 386q135-105 275-7t313-12v78H346z" fill="#82906f"/>
    <path d="M346 421q154-75 290-5t298-6v35H346z" fill="#596d55"/>
    <text x="377" y="223" fill="#6a5947" font-family="Georgia,serif" font-size="22" font-style="italic">the good days</text>
    <text x="377" y="250" fill="#6a5947" font-family="Georgia,serif" font-size="22" font-style="italic">look good on you</text>
    <text x="640" y="489" fill="#b86f69" font-family="Georgia,serif" font-size="32" text-anchor="middle">✿</text>
    <text x="640" y="537" fill="#393a33" font-family="Georgia,serif" font-size="39" text-anchor="middle">Alex, you make life</text>
    <text x="640" y="580" fill="#b86f69" font-family="Georgia,serif" font-size="39" font-style="italic" text-anchor="middle">a little brighter.</text>
    <text x="640" y="614" fill="#737168" font-family="Arial,sans-serif" font-size="13" text-anchor="middle">Here’s to all the little things that make you, you.</text>
    <text x="640" y="647" fill="#56564e" font-family="Georgia,serif" font-size="16" font-style="italic" text-anchor="middle">with so much love, Sam ♡</text>
    <rect x="491" y="667" width="298" height="31" rx="2" fill="#f6f0e6" stroke="#e5d9cd"/>
    <text x="640" y="687" fill="#6d655a" font-family="Georgia,serif" font-size="14" font-style="italic" text-anchor="middle">There’s one more thing…  ✧</text>
  </g>
  <text x="73" y="724" fill="#887f70" font-family="Georgia,serif" font-size="15" font-style="italic">Illustrative product preview</text>
</svg>
